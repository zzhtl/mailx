[workspace]
resolver = "2"
members = [
    "crates/mailx-app",
    "crates/mailx-core",
    "crates/mailx-proto",
    "crates/mailx-store",
    "crates/mailx-render",
    "crates/mailx-preview",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/zzhtl/mailx"

[workspace.dependencies]
# UI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.29"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "fs", "time"] }
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal
mailx-core = { path = "crates/mailx-core" }
mailx-proto = { path = "crates/mailx-proto" }
mailx-store = { path = "crates/mailx-store" }
mailx-render = { path = "crates/mailx-render" }
mailx-preview = { path = "crates/mailx-preview" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
